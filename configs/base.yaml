# Base configuration for lstm_scaling experiments.
hidden_dim: 128
model_type: "lstm"
mamba_d_state: 16
mamba_state_size: 16
mamba_head_dim: 16
# Pure blocking factor for the chunked SSD scan -- same function at any value,
# only the fp32 accumulation order changes. Measured at hd128/seq8192/batch64:
# 128 -> 1700ms, 64 -> 1337ms, 32 -> 1144ms, 16 -> 1086ms, 8 -> 1088ms.
# 16 is the optimum (1.57x over 128); below it the scan length stops paying for
# the per-chunk quadratic term. Re-measure for very different hidden_dim/seq_len.
mamba_chunk_size: 16
mamba_expand: 2
mamba_conv_kernel: 4
transformer_num_heads: 8
transformer_num_kv_heads: 8
transformer_ffn_mult: 2.6666666667
transformer_rope_theta: 1000000.0
transformer_layer_norm_epsilon: 1e-6
transformer_tie_word_embeddings: true
num_layers: 1
seq_len: 512
batch_size: 64
grad_accum_steps: 1
learning_rate: 1e-3
lr_schedule: "constant" # constant | warmup_cosine
warmup_steps: 0
min_learning_rate: 0.0
num_epochs: 10
dry_run: false
run_name: ""
dataset_name: "wikitext"
dataset_config: "wikitext-103-raw-v1"
dataset_path: null
cache_dir: "data/cache"
require_cached_data: true
vocab_size: 8192
bos_token_id: 0
tokenizer_path: "data/tokenizer/tokenizer.json"
tokenize_batch_size: 32
log_every_n_steps: 50
eval_every_n_steps: 200
early_stop_patience: 5
early_stop_min_delta: 0.0001
log_train_ngram_after_training: false
# 0 = the original half-epoch + end-of-epoch checkpoint cadence.
# > 0 = checkpoint every N cumulative training tokens instead, plus one at the
# end. Token milestones are comparable across corpora of different sizes.
checkpoint_every_n_tokens: 0
checkpoint_dir: "checkpoints/"
results_dir: "results/"
# Conditional entropy sampling
entropy_num_samples: 100000
entropy_sample_batch_size: 512
entropy_every_n_epochs: 1
# W&B
wandb_project: "scaling"
wandb_entity: null
wandb_group: null
